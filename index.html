<style>

<body>

</div>

<a-scene

<script>
'use strict';

// ======================================================
// BASIC SETTINGS AND STATE
// ======================================================

const T = AFRAME.THREE;

const scene = document.querySelector('a-scene');
const rig = document.querySelector('#rig');
const cam = document.querySelector('#camera');
const arms = document.querySelector('#arms');
const anchor = document.querySelector('#arm-anchor');

const $ = id => document.getElementById(id);

const clamp = (v, a, b) =>
  Math.max(a, Math.min(b, v));

const rand = (a, b) =>
  a + Math.random() * (b - a);

const SPEED = 1.3;
const END_DEPTH = 200;
const SUBMERGE_DEPTH = 3.5;

let depth = 0;
let diving = false;
let ended = false;
let muted = false;
let last = 0;
let nextCreature = 0;
let lastHandBubbles = 0;

const pose = {
  ready: false,
  bones: [],
  original: [],
  hands: [],
  base: null,
  extensions: []
};

// ======================================================
// AUDIO FILES
// Put these five MP3s next to index.html.
// ======================================================

const FILES = {
  heart: 'brvhrtz-heartbeat-01-brvhrtz-225058.mp3',
  breath: 'hasin2004-breathing-fast-247449.mp3',
  birds: 'jonathanslattermusic-seagulls-in-coastal-village-486871.mp3',
  dolphin: 'freesound_community-dolphin-noise-6968.mp3',
  whale: 'dragon-studio-humpback-whale-382727.mp3'
};

let ctx;
let master;

let waterGain;
let birdGain;
let breathGain;
let heartGain;

let waterFilter;
let waterSource;
let heartSource;
let breathSource;
let birdSource;

let loaded = {};

const animalVoices = [];

// ======================================================
// AUDIO LOADING
// ======================================================

async function loadAudio(name) {
  try {
    const response = await fetch(FILES[name]);

    if (!response.ok) {
      throw Error(response.status);
    }

    const arrayBuffer = await response.arrayBuffer();

    loaded[name] = await ctx.decodeAudioData(arrayBuffer);

  } catch (error) {
    console.warn(
      'Audio unavailable:',
      FILES[name],
      error
    );
  }
}

function loop(name, gain) {
  if (!loaded[name]) return null;

  const source = ctx.createBufferSource();

  source.buffer = loaded[name];
  source.loop = true;

  source.connect(gain);
  source.start();

  return source;
}

// ======================================================
// SYNTHETIC UNDERWATER AMBIENCE
// ======================================================

function noiseBuffer() {
  const buffer = ctx.createBuffer(
    1,
    ctx.sampleRate * 3,
    ctx.sampleRate
  );

  const data = buffer.getChannelData(0);

  let x = 0;

  for (let i = 0; i < data.length; i++) {
    x = (x + (Math.random() * 2 - 1) * 0.09) / 1.09;
    data[i] = x * 2.2;
  }

  return buffer;
}

function oneShotNoise(seconds, volume) {
  if (!ctx) return;

  const source = ctx.createBufferSource();
  const filter = ctx.createBiquadFilter();
  const gain = ctx.createGain();

  const time = ctx.currentTime;

  source.buffer = noiseBuffer();

  filter.type = 'lowpass';

  filter.frequency.setValueAtTime(1800, time);
  filter.frequency.exponentialRampToValueAtTime(
    110,
    time + seconds
  );

  gain.gain.setValueAtTime(0.001, time);
  gain.gain.linearRampToValueAtTime(
    volume,
    time + 0.12
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    time + seconds
  );

  source.connect(filter);
  filter.connect(gain);
  gain.connect(master);

  source.start();
  source.stop(time + seconds);
}

// ======================================================
// INITIALIZE AUDIO
// ======================================================

async function initAudio() {
  if (ctx) {
    await ctx.resume();
    return;
  }

  ctx = new (
    window.AudioContext ||
    window.webkitAudioContext
  )();

  master = ctx.createGain();
  master.gain.value = 0.8;

  const limiter = ctx.createDynamicsCompressor();

  limiter.threshold.value = -20;
  limiter.ratio.value = 6;

  master.connect(limiter);
  limiter.connect(ctx.destination);

  // Underwater ambience starts almost silent.
  waterGain = ctx.createGain();
  waterGain.gain.value = 0.008;

  waterFilter = ctx.createBiquadFilter();
  waterFilter.type = 'lowpass';
  waterFilter.frequency.value = 550;

  waterSource = ctx.createBufferSource();
  waterSource.buffer = noiseBuffer();
  waterSource.loop = true;

  waterSource.connect(waterFilter);
  waterFilter.connect(waterGain);
  waterGain.connect(master);

  waterSource.start();

  // Seagulls at the surface.
  birdGain = ctx.createGain();
  birdGain.gain.value = 0.20;
  birdGain.connect(master);

  // Breathing, initially silent.
  breathGain = ctx.createGain();
  breathGain.gain.value = 0;
  breathGain.connect(master);

  // Heartbeat, initially silent.
  heartGain = ctx.createGain();
  heartGain.gain.value = 0;
  heartGain.connect(master);

  // Load the actual audio recordings.
  await Promise.all(
    Object.keys(FILES).map(loadAudio)
  );

  birdSource = loop('birds', birdGain);
  breathSource = loop('breath', breathGain);
  heartSource = loop('heart', heartGain);

  await ctx.resume();
}

// ======================================================
// AUDIO CHANGES WITH DEPTH
// ======================================================

function updateSound() {
  if (!ctx) return;

  const time = ctx.currentTime;

  const underwater = clamp(
    (depth - SUBMERGE_DEPTH) / 2,
    0,
    1
  );

  const intensity = clamp(
    depth / END_DEPTH,
    0,
    1
  );

  // Seagulls fade out after submersion.
  birdGain.gain.setTargetAtTime(
    0.20 * (1 - underwater),
    time,
    0.38
  );

  // Ocean becomes more audible underwater.
  waterGain.gain.setTargetAtTime(
    0.008 + underwater * (0.075 + intensity * 0.10),
    time,
    0.35
  );

  // Muffle the ocean as depth increases.
  waterFilter.frequency.setTargetAtTime(
    550 - underwater * 260,
    time,
    0.5
  );

  // Breathing intensifies with depth.
  breathGain.gain.setTargetAtTime(
    underwater * (0.12 + intensity * 0.40),
    time,
    0.35
  );

  // Boost the quiet heartbeat recording.
  heartGain.gain.setTargetAtTime(
    underwater * (0.26 + intensity * 0.65),
    time,
    0.35
  );
}

// ======================================================
// POSITIONAL ANIMAL AUDIO
// ======================================================

function spatialAnimal(name, entity) {
  if (!ctx || !loaded[name]) return;

  const source = ctx.createBufferSource();
  const panner = ctx.createPanner();
  const gain = ctx.createGain();

  source.buffer = loaded[name];

  panner.panningModel = 'HRTF';
  panner.distanceModel = 'inverse';

  panner.refDistance = 18;
  panner.rolloffFactor = 0.8;
  panner.maxDistance = 100;

  gain.gain.value =
    name === 'whale' ? 1.3 : 1.0;

  source.connect(gain);
  gain.connect(panner);
  panner.connect(master);

  const voice = {
    entity,
    panner,
    source,
    gain
  };

  animalVoices.push(voice);

  source.onended = () => {
    const index = animalVoices.indexOf(voice);

    if (index >= 0) {
      animalVoices.splice(index, 1);
    }

    panner.disconnect();
    gain.disconnect();
  };

  source.start();

  return voice;
}

// ======================================================
// AUDIO LISTENER AND MOVING CREATURE SOUNDS
// ======================================================

function updateListener() {
  if (!ctx) return;

  scene.object3D.updateMatrixWorld(true);

  const position = new T.Vector3();
  const quaternion = new T.Quaternion();

  const forward = new T.Vector3(0, 0, -1);
  const up = new T.Vector3(0, 1, 0);

  cam.object3D.getWorldPosition(position);
  cam.object3D.getWorldQuaternion(quaternion);

  forward.applyQuaternion(quaternion);
  up.applyQuaternion(quaternion);

  const listener = ctx.listener;

  if (listener.positionX) {
    listener.positionX.value = position.x;
    listener.positionY.value = position.y;
    listener.positionZ.value = position.z;

    listener.forwardX.value = forward.x;
    listener.forwardY.value = forward.y;
    listener.forwardZ.value = forward.z;

    listener.upX.value = up.x;
    listener.upY.value = up.y;
    listener.upZ.value = up.z;
  }

  for (const voice of animalVoices) {
    voice.entity.object3D.getWorldPosition(position);

    voice.panner.positionX.value = position.x;
    voice.panner.positionY.value = position.y;
    voice.panner.positionZ.value = position.z;
  }
}

// ======================================================
// LOAD AND POSITION THE EXISTING HUMAN ARMS
// ======================================================

arms.addEventListener('model-loaded', () => {
  const model = arms.getObject3D('mesh');

  if (!model) return;

  const bones = {};
  let skin = new T.Color('#b68b75');

  model.traverse(object => {
    if (object.isBone) {
      bones[object.name] = object;
    }

    if (object.isSkinnedMesh) {
      object.frustumCulled = false;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach(material => {
        if (!material) return;

        material.side = T.DoubleSide;

        if (material.color) {
          skin.copy(material.color);
        }
      });
    }
  });

  const leftShoulder = bones.upperarm_l_02;
  const rightShoulder = bones.upperarm_r_020;

  const leftHand = bones.hand_l_04;
  const rightHand = bones.hand_r_022;

  if (
    !leftShoulder ||
    !rightShoulder ||
    !leftHand ||
    !rightHand
  ) {
    console.error(
      'Missing arm bones',
      Object.keys(bones)
    );
    return;
  }

  model.position.set(0, 0, 0);
  model.rotation.set(0, 0, 0);
  model.scale.set(1, 1, 1);

  model.updateMatrixWorld(true);

  const local = bone => {
    const position = new T.Vector3();

    bone.getWorldPosition(position);

    return model.parent.worldToLocal(position);
  };

  const L = local(leftShoulder);
  const R = local(rightShoulder);

  const HL = local(leftHand);
  const HR = local(rightHand);

  const shoulderMid = L.clone()
    .add(R)
    .multiplyScalar(0.5);

  const handMid = HL.clone()
    .add(HR)
    .multiplyScalar(0.5);

  const across = HR.clone()
    .sub(HL)
    .normalize();

  const forward = handMid
    .sub(shoulderMid)
    .normalize();

  const up = new T.Vector3()
    .crossVectors(across, forward)
    .normalize();

  const front = new T.Vector3()
    .crossVectors(across, up)
    .normalize();

  const rotation = new T.Quaternion()
    .setFromRotationMatrix(
      new T.Matrix4()
        .makeBasis(across, up, front)
        .invert()
    );

  arms.object3D.quaternion.copy(rotation);

  const averageLength =
    (
      L.distanceTo(HL) +
      R.distanceTo(HR)
    ) / 2;

  const scale = 1.58 /
    Math.max(0.001, averageLength);

  arms.object3D.scale.setScalar(scale);

  const rotatedShoulderMid = shoulderMid
    .clone()
    .applyQuaternion(rotation)
    .multiplyScalar(scale);

  arms.object3D.position.set(
    -rotatedShoulderMid.x,
    -1.12 - rotatedShoulderMid.y,
    -0.12 - rotatedShoulderMid.z
  );

  leftShoulder.rotateZ(-0.21);
  rightShoulder.rotateZ(0.21);

  pose.bones = [
    leftShoulder,
    rightShoulder
  ];

  pose.original = pose.bones.map(
    bone => bone.quaternion.clone()
  );

  pose.hands = [
    leftHand,
    rightHand
  ];

  pose.base = arms.object3D.position.clone();

  // Shoulder extensions.
  const geometry = new T.CylinderGeometry(
    0.16,
    0.27,
    0.8,
    16
  );

  const material = new T.MeshStandardMaterial({
    color: skin,
    roughness: 0.95,
    side: T.DoubleSide
  });

  for (let i = 0; i < 2; i++) {
    const mesh = new T.Mesh(geometry, material);

    mesh.frustumCulled = false;

    anchor.object3D.add(mesh);
    pose.extensions.push(mesh);
  }

  pose.ready = true;
});

// ======================================================
// UPDATE SHOULDER EXTENSIONS
// ======================================================

function updateExtensions() {
  anchor.object3D.updateMatrixWorld(true);

  pose.bones.forEach((bone, i) => {
    const shoulderPosition = new T.Vector3();

    bone.getWorldPosition(shoulderPosition);

    anchor.object3D.worldToLocal(
      shoulderPosition
    );

    const end = shoulderPosition.clone().add(
      new T.Vector3(
        i === 0 ? -0.12 : 0.12,
        -0.70,
        0.23
      )
    );

    const direction = end.clone()
      .sub(shoulderPosition);

    const extension = pose.extensions[i];

    extension.position.copy(
      shoulderPosition
        .add(end)
        .multiplyScalar(0.5)
    );

    extension.quaternion.setFromUnitVectors(
      new T.Vector3(0, 1, 0),
      direction.clone().normalize()
    );

    extension.scale.y = direction.length() / 0.8;
  });
}

// ======================================================
// HAND BUBBLES
// Only appear after the head is underwater.
// ======================================================

function bubbleFromHand(hand) {
  if (
    depth < SUBMERGE_DEPTH ||
    !diving ||
    ended
  ) return;

  const position = new T.Vector3();

  hand.getWorldPosition(position);

  const bubble = document.createElement('a-sphere');

  const x = position.x + rand(-0.09, 0.09);
  const y = position.y + rand(-0.07, 0.07);
  const z = position.z + rand(-0.09, 0.09);

  const duration = rand(900, 1700);

  bubble.setAttribute(
    'radius',
    rand(0.012, 0.035)
  );

  bubble.setAttribute(
    'position',
    `${x} ${y} ${z}`
  );

  bubble.setAttribute(
    'material',
    'shader:flat;color:#d9f9ff;transparent:true;opacity:.65;depthWrite:false'
  );

  bubble.setAttribute(
    'animation__rise',
    `property:position;to:${x + rand(-0.2, 0.2)} ${y + rand(0.5, 1.2)} ${z + rand(-0.2, 0.2)};dur:${duration}`
  );

  bubble.setAttribute(
    'animation__fade',
    `property:material.opacity;to:0;dur:${duration}`
  );

  scene.appendChild(bubble);

  setTimeout(
    () => bubble.remove(),
    duration + 50
  );
}

// ======================================================
// FLOATING ARM ANIMATION
// ======================================================

function animateArms(time) {
  if (!pose.ready) return;

  const pitch = cam.object3D.rotation.x;

  anchor.object3D.rotation.x = -pitch * 0.56;

  const lookingDown = Math.max(0, -pitch);

  anchor.object3D.position.set(
    0,
    -lookingDown * 0.48,
    -lookingDown * 0.08
  );

  const intensity = diving ? 1 : 0.35;

  arms.object3D.position.copy(pose.base);

  arms.object3D.position.x +=
    (
      Math.sin(time * 0.55) * 0.028 +
      Math.sin(time * 1.12) * 0.012
    ) * intensity;

  arms.object3D.position.y +=
    (
      Math.sin(time * 0.85) * 0.045 +
      Math.sin(time * 1.47 + 0.8) * 0.025
    ) * intensity;

  arms.object3D.position.z +=
    Math.sin(time * 0.74 + 0.4) *
    0.055 *
    intensity;

  pose.bones.forEach((bone, i) => {
    bone.quaternion.copy(pose.original[i]);

    const phase = i ? 1.65 : 0;

    bone.rotateX(
      Math.sin(time * 0.88 + phase) *
      0.095 *
      intensity
    );

    bone.rotateY(
      Math.sin(time * 0.61 + phase) *
      0.055 *
      intensity
    );

    bone.rotateZ(
      Math.sin(time * 1.15 + phase) *
      0.035 *
      intensity
    );
  });

  arms.object3D.updateMatrixWorld(true);

  updateExtensions();

  // No hand bubbles while above water.
  if (
    diving &&
    depth >= SUBMERGE_DEPTH &&
    time * 1000 - lastHandBubbles > 170
  ) {
    pose.hands.forEach(hand => {
      bubbleFromHand(hand);
      bubbleFromHand(hand);
    });

    lastHandBubbles = time * 1000;
  }
}

// ======================================================
// DEPTH AND LIGHTING
// Almost complete darkness by 185 meters.
// ======================================================

function updateOcean() {
  const d = depth;

  let color;
  let light;
  let fog;

  if (d < 40) {
    const k = clamp(d / 40, 0, 1);

    color = new T.Color('#88ccff')
      .lerp(new T.Color('#06374f'), k);

    light = 1.8 * (1 - k * 0.8);
    fog = 0.005 + k * 0.012;

  } else if (d < 120) {
    const k = (d - 40) / 80;

    color = new T.Color('#06374f')
      .lerp(new T.Color('#00070b'), k);

    light = 0.36 * (1 - k);
    fog = 0.017 + k * 0.022;

  } else {
    const k = clamp(
      (d - 120) / 65,
      0,
      1
    );

    color = new T.Color('#00070b')
      .lerp(new T.Color('#000000'), k);

    light = 0;
    fog = 0.039 + k * 0.035;
  }

  const hex = '#' + color.getHexString();

  $('sky').setAttribute('color', hex);

  scene.setAttribute(
    'fog',
    `type:exponential;color:${hex};density:${fog}`
  );

  $('sunlight').setAttribute(
    'light',
    'intensity',
    light
  );

  $('ambient').setAttribute(
    'light',
    'intensity',
    Math.max(
      0.015,
      0.85 * (1 - d / 175)
    )
  );

  $('lamp').setAttribute(
    'light',
    'intensity',
    d > 95
      ? Math.min(
          0.75,
          (d - 95) / 90 * 0.75
        )
      : 0
  );

  $('zone').textContent =
    d < 40
      ? 'SUNLIGHT ZONE'
      : d < 120
        ? 'TWILIGHT ZONE'
        : d < 180
          ? 'MIDNIGHT ZONE'
          : 'THE VOID';

  $('surface').setAttribute(
    'visible',
    d < 12
  );
}

// ======================================================
// CREATURE TYPES
// ======================================================

const TYPES = [
  {
    file: 'school_of_herring.glb',
    scale: 5,
    dur: 26000
  },
  {
    file: 'ray.glb',
    scale: 0.3,
    dur: 27000
  },
  {
    file: 'dolphin.glb',
    scale: 45,
    dur: 22000,
    sound: 'dolphin'
  },
  {
    file: 'whale.glb',
    scale: 3,
    dur: 34000,
    sound: 'whale',
    flip: true
  },
  {
    file: 'blue_whale.glb',
    scale: 5,
    dur: 42000,
    sound: 'whale'
  }
];

// ======================================================
// CREATURE SPAWNING
// Creatures can arrive from any direction.
// ======================================================

function spawnCreature() {
  if (
    !diving ||
    ended ||
    depth < 5
  ) return;

  let index;

  const random = Math.random();

  if (depth < 35) {
    index = random < 0.8 ? 0 : 2;

  } else if (depth < 95) {
    index =
      random < 0.3 ? 0 :
      random < 0.5 ? 1 :
      random < 0.78 ? 2 : 3;

  } else {
    index =
      random < 0.15 ? 0 :
      random < 0.3 ? 1 :
      random < 0.48 ? 2 :
      random < 0.8 ? 3 : 4;
  }

  const config = TYPES[index];

  const yaw = cam.object3D.rotation.y;

  // Full 360-degree spawning.
  const theta = yaw + rand(
    -Math.PI,
    Math.PI
  );

  const radius = index >= 3
    ? rand(45, 70)
    : rand(28, 50);

  const start = new T.Vector3(
    Math.sin(theta) * radius,
    7 - depth + rand(-10, 8),
    -Math.cos(theta) * radius
  );

  start.y = Math.min(start.y, 2);

  const target = new T.Vector3(
    rand(-12, 12),
    rand(-3, 3),
    rand(-12, 12)
  );

  const heading = target.clone()
    .sub(start);

  heading.y = 0;
  heading.normalize();

  const end = start.clone().addScaledVector(
    heading,
    index >= 3 ? 105 : 75
  );

  const entity = document.createElement('a-entity');

  entity.setAttribute(
    'position',
    `${start.x} ${start.y} ${start.z}`
  );

  const model = document.createElement('a-gltf-model');

  model.setAttribute('src', config.file);

  model.setAttribute(
    'scale',
    `${config.scale} ${config.scale} ${config.scale}`
  );

  model.setAttribute(
    'animation-mixer',
    'clip:*;timeScale:1'
  );

  entity.appendChild(model);

  $('creatures').appendChild(entity);

  // Rotate animals to face their direction of travel.
  // The humpback model has a 180-degree correction.
  const facing =
    Math.atan2(heading.x, heading.z) *
    180 / Math.PI +
    (config.flip ? 180 : 0);

  entity.setAttribute(
    'rotation',
    `0 ${facing} 0`
  );

  // Start invisible, then fade in as they approach.
  model.addEventListener('model-loaded', () => {
    const root = model.getObject3D('mesh');

    if (!root) return;

    root.traverse(object => {
      if (!object.isMesh) return;

      object.frustumCulled = false;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      object.userData.fadeMaterials = materials.map(
        material => {
          const copy = material.clone();

          copy.transparent = true;
          copy.opacity = 0;
          copy.depthWrite = false;

          return copy;
        }
      );

      object.material = Array.isArray(object.material)
        ? object.userData.fadeMaterials
        : object.userData.fadeMaterials[0];
    });
  });

  const born = performance.now();

  let voicePlayed = false;

  function update() {
    if (!entity.isConnected) return;

    const progress = clamp(
      (performance.now() - born) / config.dur,
      0,
      1
    );

    entity.object3D.position.lerpVectors(
      start,
      end,
      progress
    );

    const cameraPosition = new T.Vector3();

    cam.object3D.getWorldPosition(
      cameraPosition
    );

    const distance = entity.object3D.position
      .distanceTo(cameraPosition);

    // Fade based on proximity and time.
    const fade =
      clamp((65 - distance) / 35, 0, 1) *
      clamp(progress * 9, 0, 1);

    const root = model.getObject3D('mesh');

    if (root) {
      root.traverse(object => {
        if (!object.userData.fadeMaterials) return;

        object.userData.fadeMaterials.forEach(
          material => {
            material.opacity = fade;
            material.needsUpdate = true;
          }
        );
      });
    }

    // Play the correct recording when nearby.
    if (
      !voicePlayed &&
      config.sound &&
      distance < 75
    ) {
      voicePlayed = true;

      spatialAnimal(
        config.sound,
        entity
      );
    }

    if (progress < 1) {
      requestAnimationFrame(update);
    } else {
      entity.remove();
    }
  }

  requestAnimationFrame(update);

  setTimeout(
    () => entity.remove(),
    config.dur + 1000
  );
}

// ======================================================
// MARINE SNOW
// ======================================================

function snow() {
  const group = $('snow');

  for (let i = 0; i < 75; i++) {
    const particle = document.createElement('a-sphere');

    particle.setAttribute(
      'position',
      `${rand(-14, 14)} ${rand(-14, 14)} ${rand(-14, 14)}`
    );

    particle.setAttribute(
      'radius',
      rand(0.003, 0.012)
    );

    particle.setAttribute(
      'material',
      `shader:flat;color:#fff;transparent:true;opacity:${rand(0.04, 0.22)}`
    );

    group.appendChild(particle);
  }
}

// ======================================================
// ENDING AT 200 METERS
// ======================================================

function attack() {
  if (ended) return;

  ended = true;
  diving = false;

  $('status').textContent = 'SIGNAL LOST';

  $('monster').setAttribute(
    'visible',
    true
  );

  oneShotNoise(1.7, 0.8);

  const startTime = performance.now();

  function shake() {
    const elapsed = performance.now() - startTime;

    if (elapsed > 700) {
      cam.object3D.position.set(0, 0, 0);
      return;
    }

    const strength =
      (1 - elapsed / 700) * 0.13;

    cam.object3D.position.set(
      rand(-strength, strength),
      rand(-strength, strength),
      rand(-strength, strength)
    );

    requestAnimationFrame(shake);
  }

  shake();

  $('flash').style.opacity = '0.9';

  setTimeout(() => {
    $('flash').style.background = '#000';
    $('flash').style.opacity = '1';
  }, 160);

  setTimeout(() => {
    $('ending').style.display = 'block';
    $('flash').style.opacity = '0';

    if (master) {
      master.gain.setTargetAtTime(
        0,
        ctx.currentTime,
        0.3
      );
    }
  }, 1100);
}

// ======================================================
// MAIN ANIMATION LOOP
// ======================================================

function tick(now) {
  requestAnimationFrame(tick);

  const dt = last
    ? Math.min((now - last) / 1000, 0.1)
    : 0;

  last = now;

  animateArms(now / 1000);

  if (diving) {
    depth = Math.min(
      END_DEPTH,
      depth + dt * SPEED
    );

    rig.object3D.position.y = 7 - depth;

    $('depth').textContent = depth.toFixed(1);

    $('status').textContent =
      depth < SUBMERGE_DEPTH
        ? 'ENTERING WATER'
        : 'DESCENDING';

    updateOcean();
    updateSound();

    // The moment the head enters the water.
    if (
      depth >= SUBMERGE_DEPTH &&
      !tick.submerged
    ) {
      tick.submerged = true;
      oneShotNoise(2, 0.45);
    }

    if (now > nextCreature) {
      spawnCreature();

      nextCreature = now + rand(
        6500,
        10500
      );
    }

    if (depth >= END_DEPTH) {
      attack();
    }
  }

  updateListener();
}

// ======================================================
// RESTART
// ======================================================

function reset() {
  diving = false;
  ended = false;
  depth = 0;

  tick.submerged = false;

  rig.object3D.position.set(0, 7, 0);
  cam.object3D.position.set(0, 0, 0);

  $('depth').textContent = '0.0';
  $('status').textContent = 'SURFACE READY';

  $('start').style.display = 'block';
  $('ending').style.display = 'none';

  $('flash').style.opacity = '0';
  $('flash').style.background = '#fff';

  $('monster').setAttribute(
    'visible',
    'false'
  );

  $('creatures').replaceChildren();

  updateOcean();

  if (master) {
    master.gain.setTargetAtTime(
      muted ? 0 : 0.8,
      ctx.currentTime,
      0.2
    );
  }

  updateSound();
}

// ======================================================
// BUTTONS
// ======================================================

$('go').onclick = async () => {
  await initAudio();

  diving = true;

  $('start').style.display = 'none';

  nextCreature = performance.now() + 2200;
};

$('mute').onclick = () => {
  muted = !muted;

  $('mute').textContent = muted
    ? '🔇 AUDIO OFF'
    : '🔊 AUDIO ON';

  if (master) {
    master.gain.setTargetAtTime(
      muted ? 0 : 0.8,
      ctx.currentTime,
      0.1
    );
  }
};

$('restart').onclick = reset;
$('again').onclick = reset;

// ======================================================
// START
// ======================================================

if (scene.hasLoaded) {
  snow();
} else {
  scene.addEventListener(
    'loaded',
    snow,
    { once: true }
  );
}

updateOcean();
requestAnimationFrame(tick);

</script>
