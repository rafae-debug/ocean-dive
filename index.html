<body>

<div id="ui-overlay"

<a-scene

        position="-10 3 20" rotation="160 0 0"></a-cone>

        position="0 2 22" rotation="160 0 0"></a-cone>

        position="10 3 20" rotation="160 0 0"></a-cone>

<script>

// ======================================================
// SETTINGS
// ======================================================

const THREE = AFRAME.THREE;

const SETTINGS = {

  maxDepth: 480,
  descentSpeed: 1.3,

  // Overall sound output.
  masterVolume: 1.65,

  // Environmental sound.
  oceanVolume: 0.55,
  bassVolume: 0.65,
  breathingVolume: 0.32,

  // Creature sounds.
  creatureVolume: 0.9,
  creatureMaxDistance: 115,

  // Arms.
  armLength: 1.48,
  armSpread: 0.16,

  shoulderY: -1.34,
  shoulderZ: -0.12,

  armFloat: 0.045,
  armSway: 0.024,

  headPitchCompensation: 0.56,

  // Bubbles.
  handBubbleInterval: 115,
  handBubbleCount: 4,
  handBubbleSize: 0.025,

  // Shoulder extension.
  shoulderExtensionLength: 0.8
};

// ======================================================
// STATE
// ======================================================

let isDiving = false;
let isMuted = false;
let currentDepth = 0;

let lastTimestamp = 0;
let creatureSpawnTimer = 0;

const sceneEl = document.querySelector('a-scene');

const cameraRig = document.getElementById('rig');
const cameraEl = document.getElementById('camera');

const diverArms = document.getElementById('diver-arms');
const armAnchor = document.getElementById('arm-anchor');

const depthDisplay = document.getElementById('depth-display');
const zoneDisplay = document.getElementById('zone-display');
const statusDisplay = document.getElementById('descent-status');

const startScreen = document.getElementById('start-screen');
const startBtn = document.getElementById('start-btn');

const soundToggleBtn = document.getElementById('sound-toggle-btn');
const soundState = document.getElementById('sound-state');
const recenterBtn = document.getElementById('recenter-btn');

const oceanSky = document.getElementById('ocean-sky');
const sunlight = document.getElementById('sunlight');
const ambientLight = document.getElementById('ambient-light');
const flashlight = document.getElementById('flashlight');

const armState = {

  ready: false,

  shoulders: [],
  originalRotations: [],

  hands: [],

  basePosition: null,

  shoulderExtensions: [],

  lastHeadQuaternion: null,
  lastBubbleTime: 0
};

const activeCreatures = [];

// ======================================================
// AUDIO STATE
// ======================================================

let audioCtx = null;

let masterGain = null;
let compressor = null;

let oceanGain = null;
let bassGain = null;
let bassOsc = null;
let breathingGain = null;

let breathingTimer = null;
let heartbeatTimer = null;

// ======================================================
// AUDIO INITIALIZATION
// ======================================================

function initAudio() {

  if (audioCtx) return;

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContextClass) return;

  audioCtx = new AudioContextClass();

  masterGain = audioCtx.createGain();

  masterGain.gain.value =
    isMuted ? 0 : SETTINGS.masterVolume;

  // Prevent loud sounds from clipping excessively.
  compressor = audioCtx.createDynamicsCompressor();

  compressor.threshold.value = -18;
  compressor.knee.value = 20;
  compressor.ratio.value = 5;
  compressor.attack.value = 0.008;
  compressor.release.value = 0.25;

  masterGain.connect(compressor);
  compressor.connect(audioCtx.destination);

  // White/pinkish underwater noise.
  const noiseBuffer = createNoiseBuffer(4);

  const oceanNoise = audioCtx.createBufferSource();

  oceanNoise.buffer = noiseBuffer;
  oceanNoise.loop = true;

  const oceanFilter = audioCtx.createBiquadFilter();

  oceanFilter.type = 'lowpass';
  oceanFilter.frequency.value = 450;

  oceanGain = audioCtx.createGain();

  oceanGain.gain.value =
    SETTINGS.oceanVolume;

  oceanNoise.connect(oceanFilter);
  oceanFilter.connect(oceanGain);
  oceanGain.connect(masterGain);

  oceanNoise.start();

  // Low underwater pressure drone.
  bassOsc = audioCtx.createOscillator();

  bassOsc.type = 'sine';
  bassOsc.frequency.value = 48;

  bassGain = audioCtx.createGain();

  bassGain.gain.value = 0.035;

  bassOsc.connect(bassGain);
  bassGain.connect(masterGain);

  bassOsc.start();

  // Separate filtered breathing noise.
  const breathNoise = audioCtx.createBufferSource();

  breathNoise.buffer = noiseBuffer;
  breathNoise.loop = true;

  const breathFilter = audioCtx.createBiquadFilter();

  breathFilter.type = 'bandpass';
  breathFilter.frequency.value = 650;
  breathFilter.Q.value = 0.65;

  breathingGain = audioCtx.createGain();

  breathingGain.gain.value = 0.001;

  breathNoise.connect(breathFilter);
  breathFilter.connect(breathingGain);
  breathingGain.connect(masterGain);

  breathNoise.start();

  scheduleBreathing();
  scheduleHeartbeat();
}

function createNoiseBuffer(seconds = 2) {

  const length =
    Math.floor(audioCtx.sampleRate * seconds);

  const buffer =
    audioCtx.createBuffer(
      1,
      length,
      audioCtx.sampleRate
    );

  const data = buffer.getChannelData(0);

  let previous = 0;

  for (let i = 0; i < length; i++) {

    const white = Math.random() * 2 - 1;

    previous =
      (previous + white * 0.08) / 1.08;

    data[i] = previous * 3.5;
  }

  return buffer;
}

// ======================================================
// SPATIAL CREATURE AUDIO
// ======================================================
//
// Each animal has its own sound design.
// Sounds are synthesized in the browser;
// no additional MP3 files are required.
//
// PannerNode gives distance attenuation and
// left/right spatial direction.
// ======================================================

function createCreatureAudio(type, creatureEl, durationMs) {

  if (!audioCtx || !masterGain) {
    return null;
  }

  const now = audioCtx.currentTime;

  const duration =
    Math.min(durationMs / 1000, 12);

  const output = audioCtx.createGain();

  output.gain.value = 0;

  const panner = audioCtx.createPanner();

  panner.panningModel = 'HRTF';

  panner.distanceModel = 'inverse';

  panner.refDistance = 5;
  panner.maxDistance = SETTINGS.creatureMaxDistance;

  panner.rolloffFactor = 1.5;

  output.connect(panner);
  panner.connect(masterGain);

  const oscillators = [];

  function addTone(
    frequency,
    waveform,
    volume,
    modulationDepth = 0,
    modulationRate = 0
  ) {

    const oscillator = audioCtx.createOscillator();

    oscillator.type = waveform;
    oscillator.frequency.value = frequency;

    const gain = audioCtx.createGain();

    gain.gain.value = volume;

    oscillator.connect(gain);
    gain.connect(output);

    if (modulationDepth > 0) {

      const lfo = audioCtx.createOscillator();

      const lfoGain = audioCtx.createGain();

      lfo.frequency.value = modulationRate;
      lfoGain.gain.value = modulationDepth;

      lfo.connect(lfoGain);
      lfoGain.connect(oscillator.frequency);

      lfo.start(now);
      lfo.stop(now + duration + 0.1);

      oscillators.push(lfo);
    }

    oscillator.start(now);
    oscillator.stop(now + duration + 0.1);

    oscillators.push(oscillator);

    return oscillator;
  }

  // HERRING:
  // Soft, irregular high-pitched movement.
  if (type === 1) {

    addTone(145, 'sine', 0.10, 35, 4.2);
    addTone(270, 'sine', 0.045, 50, 6.1);

  }

  // RAY:
  // Airy, eerie gliding hum.
  else if (type === 2) {

    addTone(95, 'sine', 0.20, 22, 0.32);
    addTone(188, 'sine', 0.07, 14, 0.5);

  }

  // DOLPHIN:
  // Distinct clicking/chirping calls.
  else if (type === 3) {

    const chirp = addTone(
      1100,
      'sine',
      0.13,
      550,
      7
    );

    chirp.frequency.setValueAtTime(
      1700,
      now
    );

    chirp.frequency.exponentialRampToValueAtTime(
      650,
      now + 0.6
    );

    addTone(380, 'sine', 0.065, 130, 3.2);

  }

  // WHALE:
  // Deep, slowly changing song.
  else if (type === 4) {

    addTone(62, 'sine', 0.40, 19, 0.16);
    addTone(124, 'sine', 0.14, 31, 0.21);
    addTone(190, 'sine', 0.06, 42, 0.12);

  }

  // BLUE WHALE:
  // Extremely deep, powerful distant call.
  else {

    addTone(28, 'sine', 0.52, 8, 0.11);
    addTone(55, 'sine', 0.32, 12, 0.17);
    addTone(92, 'triangle', 0.10, 17, 0.23);

  }

  // Fade in and out to avoid abrupt sounds.
  const peak =
    SETTINGS.creatureVolume *
    (
      type === 1 ? 0.30 :
      type === 2 ? 0.48 :
      type === 3 ? 0.65 :
      type === 4 ? 0.85 :
      1.0
    );

  output.gain.setValueAtTime(0.001, now);

  output.gain.linearRampToValueAtTime(
    peak,
    now + Math.min(0.8, duration * 0.2)
  );

  output.gain.setValueAtTime(
    peak,
    now + Math.max(0.8, duration - 1.2)
  );

  output.gain.linearRampToValueAtTime(
    0.001,
    now + duration
  );

  const position = new THREE.Vector3();

  creatureEl.object3D.getWorldPosition(position);

  setPannerPosition(panner, position);

  return {

    panner,
    output,
    oscillators,

    expiresAt:
      performance.now() + duration * 1000,

    stop() {

      try {
        output.disconnect();
        panner.disconnect();
      } catch (error) {}

    }
  };
}

function setPannerPosition(panner, position) {

  if (panner.positionX) {

    panner.positionX.value = position.x;
    panner.positionY.value = position.y;
    panner.positionZ.value = position.z;

  } else {

    panner.setPosition(
      position.x,
      position.y,
      position.z
    );
  }
}

// Keep WebAudio listener aligned with the camera.
function updateAudioListener() {

  if (!audioCtx) return;

  const listener = audioCtx.listener;

  const position = new THREE.Vector3();
  const quaternion = new THREE.Quaternion();

  cameraEl.object3D.getWorldPosition(position);
  cameraEl.object3D.getWorldQuaternion(quaternion);

  const forward = new THREE.Vector3(0, 0, -1)
    .applyQuaternion(quaternion);

  const up = new THREE.Vector3(0, 1, 0)
    .applyQuaternion(quaternion);

  if (listener.positionX) {

    listener.positionX.value = position.x;
    listener.positionY.value = position.y;
    listener.positionZ.value = position.z;

    listener.forwardX.value = forward.x;
    listener.forwardY.value = forward.y;
    listener.forwardZ.value = forward.z;

    listener.upX.value = up.x;
    listener.upY.value = up.y;
    listener.upZ.value = up.z;

  } else {

    listener.setPosition(
      position.x,
      position.y,
      position.z
    );

    listener.setOrientation(
      forward.x,
      forward.y,
      forward.z,
      up.x,
      up.y,
      up.z
    );
  }
}

function updateCreatureAudio(now) {

  const worldPosition = new THREE.Vector3();

  for (let i = activeCreatures.length - 1; i >= 0; i--) {

    const creature = activeCreatures[i];

    if (
      !creature.element.isConnected ||
      now > creature.audio.expiresAt
    ) {

      creature.audio.stop();
      activeCreatures.splice(i, 1);

      continue;
    }

    creature.element.object3D.getWorldPosition(
      worldPosition
    );

    setPannerPosition(
      creature.audio.panner,
      worldPosition
    );
  }
}

// ======================================================
// BREATHING
// ======================================================

function scheduleBreathing() {

  if (!audioCtx) return;

  if (isDiving && !isMuted) {

    const now = audioCtx.currentTime;

    const rate =
      1 + (currentDepth / SETTINGS.maxDepth) * 1.7;

    const duration =
      4.2 / rate;

    breathingGain.gain.cancelScheduledValues(now);

    breathingGain.gain.setValueAtTime(
      0.001,
      now
    );

    breathingGain.gain.linearRampToValueAtTime(
      SETTINGS.breathingVolume,
      now + duration * 0.35
    );

    breathingGain.gain.linearRampToValueAtTime(
      0.001,
      now + duration * 0.9
    );

    if (currentDepth > 3) {

      for (let i = 0; i < 5; i++) {

        setTimeout(
          spawnPlayerBubble,
          i * 140
        );
      }
    }
  }

  const delay =
    4200 /
    (
      1 +
      (currentDepth / SETTINGS.maxDepth) * 1.7
    );

  breathingTimer =
    setTimeout(scheduleBreathing, delay);
}

function spawnPlayerBubble() {

  if (!isDiving || currentDepth < 3) return;

  const container =
    document.getElementById('player-bubbles');

  const bubble =
    document.createElement('a-sphere');

  const x =
    (Math.random() - 0.5) * 0.2;

  const z =
    -0.35 + Math.random() * 0.1;

  bubble.setAttribute(
    'position',
    `${x} -0.3 ${z}`
  );

  bubble.setAttribute(
    'radius',
    0.012 + Math.random() * 0.018
  );

  bubble.setAttribute(
    'material',
    'shader: flat; color: #e7fbff; transparent: true; opacity: 0.5; depthWrite: false'
  );

  bubble.setAttribute(
    'animation__rise',
    `property: position; to: ${x * 2} 2.5 ${z}; dur: 2400; easing: easeOutSine`
  );

  bubble.setAttribute(
    'animation__fade',
    'property: material.opacity; from: 0.5; to: 0; dur: 2400'
  );

  container.appendChild(bubble);

  setTimeout(() => bubble.remove(), 2500);
}

// ======================================================
// HEARTBEAT
// ======================================================

function scheduleHeartbeat() {

  if (audioCtx && isDiving && !isMuted) {

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';

    osc.frequency.setValueAtTime(
      48,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      28,
      now + 0.18
    );

    gain.gain.setValueAtTime(
      0.15 +
      (currentDepth / SETTINGS.maxDepth) * 0.22,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.2
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + 0.21);
  }

  heartbeatTimer = setTimeout(
    scheduleHeartbeat,
    Math.max(
      380,
      1250 -
      (currentDepth / SETTINGS.maxDepth) * 850
    )
  );
}

function updateAudioParams() {

  if (!audioCtx) return;

  const ratio =
    currentDepth / SETTINGS.maxDepth;

  oceanGain.gain.setTargetAtTime(
    SETTINGS.oceanVolume + ratio * 0.25,
    audioCtx.currentTime,
    0.5
  );

  bassGain.gain.setTargetAtTime(
    0.04 + ratio * SETTINGS.bassVolume,
    audioCtx.currentTime,
    0.5
  );

  bassOsc.frequency.setTargetAtTime(
    48 - ratio * 20,
    audioCtx.currentTime,
    0.5
  );
}

// ======================================================
// HUMAN ARMS
// ======================================================

diverArms.addEventListener('model-loaded', () => {

  const model =
    diverArms.getObject3D('mesh');

  if (!model) return;

  const bones = {};

  let sampledSkinColor = new THREE.Color('#b68b75');

  model.traverse(object => {

    if (object.isBone) {
      bones[object.name] = object;
    }

    if (object.isSkinnedMesh) {

      object.frustumCulled = false;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach(material => {

        if (!material) return;

        material.side = THREE.DoubleSide;

        if (material.color) {
          sampledSkinColor.copy(material.color);
        }
      });
    }
  });

  const leftShoulder =
    bones['upperarm_l_02'];

  const rightShoulder =
    bones['upperarm_r_020'];

  const leftHand =
    bones['hand_l_04'];

  const rightHand =
    bones['hand_r_022'];

  if (
    !leftShoulder ||
    !rightShoulder ||
    !leftHand ||
    !rightHand
  ) {

    console.error(
      'Arm skeleton not found:',
      Object.keys(bones)
    );

    return;
  }

  model.position.set(0, 0, 0);
  model.rotation.set(0, 0, 0);
  model.scale.set(1, 1, 1);

  diverArms.object3D.position.set(0, 0, 0);
  diverArms.object3D.rotation.set(0, 0, 0);
  diverArms.object3D.scale.setScalar(1);

  model.updateMatrixWorld(true);

  function modelLocalPosition(bone) {

    const point = new THREE.Vector3();

    bone.getWorldPosition(point);

    return model.parent.worldToLocal(point);
  }

  const ls = modelLocalPosition(leftShoulder);
  const rs = modelLocalPosition(rightShoulder);

  const lh = modelLocalPosition(leftHand);
  const rh = modelLocalPosition(rightHand);

  const shoulderMid =
    ls.clone().add(rs).multiplyScalar(0.5);

  const handMid =
    lh.clone().add(rh).multiplyScalar(0.5);

  const across =
    rh.clone().sub(lh).normalize();

  const forward =
    handMid.clone().sub(shoulderMid).normalize();

  const up =
    new THREE.Vector3()
      .crossVectors(across, forward)
      .normalize();

  const front =
    new THREE.Vector3()
      .crossVectors(across, up)
      .normalize();

  const sourceBasis =
    new THREE.Matrix4().makeBasis(
      across,
      up,
      front
    );

  const rotation =
    new THREE.Quaternion()
      .setFromRotationMatrix(
        sourceBasis.clone().invert()
      );

  diverArms.object3D.quaternion.copy(rotation);

  const averageLength =
    (
      ls.distanceTo(lh) +
      rs.distanceTo(rh)
    ) / 2;

  const scale =
    SETTINGS.armLength /
    Math.max(averageLength, 0.001);

  diverArms.object3D.scale.setScalar(scale);

  const rotatedShoulderMid =
    shoulderMid
      .clone()
      .applyQuaternion(rotation)
      .multiplyScalar(scale);

  diverArms.object3D.position.set(
    -rotatedShoulderMid.x,
    SETTINGS.shoulderY - rotatedShoulderMid.y,
    SETTINGS.shoulderZ - rotatedShoulderMid.z
  );

  leftShoulder.rotateZ(
    -SETTINGS.armSpread
  );

  rightShoulder.rotateZ(
    SETTINGS.armSpread
  );

  armState.shoulders = [
    leftShoulder,
    rightShoulder
  ];

  armState.originalRotations =
    armState.shoulders.map(
      bone => bone.quaternion.clone()
    );

  armState.hands = [
    leftHand,
    rightHand
  ];

  armState.basePosition =
    diverArms.object3D.position.clone();

  armState.lastHeadQuaternion =
    cameraEl.object3D.quaternion.clone();

  // --------------------------------------------------
  // SHOULDER EXTENSIONS
  // --------------------------------------------------
  //
  // The GLB arms are cut off at the shoulders.
  // These tapered pieces continue down toward
  // the viewer to conceal the abrupt ends.
  //
  // They follow the shoulders but are not attached
  // to the deforming skeleton.
  // --------------------------------------------------

  const extensionMaterial =
    new THREE.MeshStandardMaterial({

      color: sampledSkinColor,
      roughness: 0.95,
      metalness: 0,
      side: THREE.DoubleSide

    });

  const extensionGeometry =
    new THREE.CylinderGeometry(
      0.16,
      0.27,
      SETTINGS.shoulderExtensionLength,
      20,
      1,
      false
    );

  for (let i = 0; i < 2; i++) {

    const extension = new THREE.Mesh(
      extensionGeometry,
      extensionMaterial
    );

    extension.frustumCulled = false;

    armAnchor.object3D.add(extension);

    armState.shoulderExtensions.push(extension);
  }

  armState.ready = true;

  console.log('Diver arms loaded.');
});

diverArms.addEventListener('model-error', error => {

  console.error(
    'Failed to load rigged_arms.glb',
    error
  );
});

// ======================================================
// SHOULDER EXTENSION POSITIONING
// ======================================================

function updateShoulderExtensions() {

  if (!armState.ready) return;

  const anchor = armAnchor.object3D;

  anchor.updateMatrixWorld(true);

  const shoulderWorld = new THREE.Vector3();
  const shoulderLocal = new THREE.Vector3();

  for (let i = 0; i < 2; i++) {

    const shoulder =
      armState.shoulders[i];

    const extension =
      armState.shoulderExtensions[i];

    shoulder.getWorldPosition(shoulderWorld);

    shoulderLocal.copy(shoulderWorld);

    anchor.worldToLocal(shoulderLocal);

    // Extend backward and downward toward the
    // player's body, instead of stopping at the
    // shoulder cap.
    const end = shoulderLocal.clone().add(
      new THREE.Vector3(
        i === 0 ? -0.12 : 0.12,
        -SETTINGS.shoulderExtensionLength * 0.88,
        0.23
      )
    );

    const direction =
      end.clone().sub(shoulderLocal);

    extension.position.copy(
      shoulderLocal.clone().add(end).multiplyScalar(0.5)
    );

    extension.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction.clone().normalize()
    );

    extension.scale.set(
      1,
      direction.length() /
        SETTINGS.shoulderExtensionLength,
      1
    );
  }
}

// ======================================================
// HAND BUBBLES
// ======================================================
//
// More noticeable than before:
// - multiple bubbles per hand
// - larger bubbles
// - visible bright highlights
// - upward movement
// - small translucent rings
// ======================================================

function spawnHandBubble(handBone) {

  if (!isDiving || currentDepth < 3) return;

  const origin = new THREE.Vector3();

  handBone.getWorldPosition(origin);

  const start = origin.clone().add(
    new THREE.Vector3(
      (Math.random() - 0.5) * 0.22,
      (Math.random() - 0.5) * 0.12,
      (Math.random() - 0.5) * 0.22
    )
  );

  const end = start.clone().add(
    new THREE.Vector3(
      (Math.random() - 0.5) * 0.4,
      0.55 + Math.random() * 0.65,
      (Math.random() - 0.5) * 0.3
    )
  );

  const radius =
    SETTINGS.handBubbleSize *
    (0.6 + Math.random() * 1.1);

  const bubble =
    document.createElement('a-sphere');

  bubble.setAttribute('radius', radius);

  bubble.setAttribute(
    'position',
    `${start.x} ${start.y} ${start.z}`
  );

  bubble.setAttribute(
    'material',
    'shader: flat; color: #d9f9ff; transparent: true; opacity: 0.78; depthWrite: false'
  );

  const duration =
    1100 + Math.random() * 650;

  bubble.setAttribute(
    'animation__rise',
    `property: position; to: ${end.x} ${end.y} ${end.z}; dur: ${duration}; easing: easeOutSine`
  );

  bubble.setAttribute(
    'animation__fade',
    `property: material.opacity; from: 0.78; to: 0; dur: ${duration}; easing: linear`
  );

  sceneEl.appendChild(bubble);

  setTimeout(
    () => bubble.remove(),
    duration + 100
  );
}

function spawnHandBubbleRing(handBone) {

  if (!isDiving || currentDepth < 3) return;

  const origin = new THREE.Vector3();

  handBone.getWorldPosition(origin);

  const ring = document.createElement('a-ring');

  ring.setAttribute(
    'position',
    `${origin.x} ${origin.y} ${origin.z}`
  );

  ring.setAttribute('radius-inner', 0.035);
  ring.setAttribute('radius-outer', 0.043);

  ring.setAttribute(
    'material',
    'shader: flat; color: #a7f4ff; transparent: true; opacity: 0.55; side: double; depthWrite: false'
  );

  ring.setAttribute(
    'animation__expand',
    'property: scale; from: 1 1 1; to: 4 4 4; dur: 800; easing: easeOutSine'
  );

  ring.setAttribute(
    'animation__fade',
    'property: material.opacity; from: 0.55; to: 0; dur: 800'
  );

  sceneEl.appendChild(ring);

  setTimeout(
    () => ring.remove(),
    850
  );
}

// ======================================================
// ARM ANIMATION
// ======================================================

function animateArms(seconds) {

  if (!armState.ready) return;

  const pitch =
    cameraEl.object3D.rotation.x;

  // Partial pitch compensation.
  //
  // The arms do not rotate completely with
  // the user's head, but also do not swing
  // all the way into view when looking down.
  armAnchor.object3D.rotation.x =
    -pitch * SETTINGS.headPitchCompensation;

  const lookingDown =
    Math.max(0, -pitch);

  // Lower the entire arm anchor as the head
  // looks down so the shoulder extensions
  // stay below the central field of view.
  armAnchor.object3D.position.y =
    -lookingDown * 0.45;

  armAnchor.object3D.position.z =
    -lookingDown * 0.08;

  const floatY =
    Math.sin(seconds * 0.55) * 0.04;

  const swayX =
    Math.sin(seconds * 0.37) * 0.025;

  diverArms.object3D.position.set(
    armState.basePosition.x + swayX,
    armState.basePosition.y + floatY,
    armState.basePosition.z
  );

  for (let i = 0; i < 2; i++) {

    const bone = armState.shoulders[i];

    bone.quaternion.copy(
      armState.originalRotations[i]
    );

    const phase =
      i === 0 ? 0 : 1.4;

    const floating =
      Math.sin(seconds * 0.72 + phase) *
      SETTINGS.armFloat;

    const swaying =
      Math.sin(seconds * 0.46 + phase) *
      SETTINGS.armSway;

    bone.rotateX(floating);
    bone.rotateY(swaying);
  }

  diverArms.object3D.updateMatrixWorld(true);

  updateShoulderExtensions();

  // Determine whether the head is moving.
  const headQuaternion =
    cameraEl.object3D.quaternion.clone();

  const movement =
    armState.lastHeadQuaternion
      ? armState.lastHeadQuaternion.angleTo(
          headQuaternion
        )
      : 0;

  armState.lastHeadQuaternion.copy(
    headQuaternion
  );

  const now = seconds * 1000;

  const timeSinceBubbles =
    now - armState.lastBubbleTime;

  const movingHead =
    movement > 0.003;

  const floatingArms =
    Math.sin(seconds * 1.2) > 0.45;

  if (
    isDiving &&
    currentDepth >= 3 &&
    timeSinceBubbles >
      SETTINGS.handBubbleInterval &&
    (movingHead || floatingArms)
  ) {

    for (const hand of armState.hands) {

      for (
        let i = 0;
        i < SETTINGS.handBubbleCount;
        i++
      ) {

        spawnHandBubble(hand);
      }

      if (Math.random() < 0.45) {

        spawnHandBubbleRing(hand);
      }
    }

    armState.lastBubbleTime = now;
  }
}

// ======================================================
// MARINE SNOW
// ======================================================

function setupMarineSnow() {

  const container =
    document.getElementById('particle-container');

  if (container.children.length) return;

  for (let i = 0; i < 75; i++) {

    const particle =
      document.createElement('a-sphere');

    const x =
      (Math.random() - 0.5) * 28;

    const y =
      (Math.random() - 0.5) * 28;

    const z =
      (Math.random() - 0.5) * 28;

    particle.setAttribute(
      'position',
      `${x} ${y} ${z}`
    );

    particle.setAttribute(
      'radius',
      0.002 + Math.random() * 0.008
    );

    particle.setAttribute(
      'material',
      `shader: flat; color: #ffffff; transparent: true; opacity: ${0.05 + Math.random() * 0.18}; depthWrite: false`
    );

    container.appendChild(particle);
  }
}

// ======================================================
// COLOR UTILITIES
// ======================================================

function hexToRgb(hex) {

  const n = parseInt(
    hex.replace('#', ''),
    16
  );

  return [
    (n >> 16) & 255,
    (n >> 8) & 255,
    n & 255
  ];
}

function rgbToHex(r, g, b) {

  return '#' +
    [r, g, b].map(value =>
      Math.round(value)
        .toString(16)
        .padStart(2, '0')
    ).join('');
}

function interpolateColor(a, b, t) {

  const c1 = hexToRgb(a);
  const c2 = hexToRgb(b);

  return rgbToHex(
    c1[0] + (c2[0] - c1[0]) * t,
    c1[1] + (c2[1] - c1[1]) * t,
    c1[2] + (c2[2] - c1[2]) * t
  );
}

// ======================================================
// WATER ANIMATION
// ======================================================

function animateWaterSurface(time) {

  const surface =
    document.getElementById('water-surface');

  const mesh =
    surface.getObject3D('mesh');

  if (!mesh) return;

  const positions =
    mesh.geometry.attributes.position;

  const t = time * 0.001;

  for (let i = 0; i < positions.count; i++) {

    const x = positions.getX(i);
    const y = positions.getY(i);

    const wave =
      Math.sin(x * 0.08 + t * 0.7) * 0.45 +
      Math.sin(y * 0.11 + t * 0.5) * 0.3 +
      Math.sin((x + y) * 0.06 + t) * 0.2;

    positions.setZ(i, wave * 0.35);
  }

  positions.needsUpdate = true;

  mesh.geometry.computeVertexNormals();
}

// ======================================================
// ENVIRONMENT
// ======================================================

function updateEnvironmentStage(depth) {

  let skyColor;
  let fogDensity;
  let sunIntensity;
  let zoneName;

  if (depth < 50) {

    const t =
      Math.max(0, (depth - 5) / 45);

    skyColor =
      interpolateColor('#88ccff', '#004f77', t);

    fogDensity =
      0.005 + t * 0.008;

    sunIntensity =
      1.8 * (1 - t * 0.6);

    zoneName =
      'Phase 1: Epipelagic (Sunlight Zone)';

    flashlight.setAttribute(
      'light',
      'intensity',
      0
    );

  } else if (depth < 150) {

    const t = (depth - 50) / 100;

    skyColor =
      interpolateColor('#004f77', '#000c14', t);

    fogDensity =
      0.013 + t * 0.012;

    sunIntensity =
      0.72 * (1 - t);

    zoneName =
      'Phase 2: Mesopelagic (Twilight Zone)';

    flashlight.setAttribute(
      'light',
      'intensity',
      t * 0.8
    );

  } else if (depth < 300) {

    const t = (depth - 150) / 150;

    skyColor =
      interpolateColor('#000c14', '#000204', t);

    fogDensity =
      0.025 + t * 0.015;

    sunIntensity = 0;

    zoneName =
      'Phase 3: Bathypelagic (Midnight Abyss)';

    flashlight.setAttribute(
      'light',
      'intensity',
      0.8 + t * 0.7
    );

  } else {

    const t =
      Math.min((depth - 300) / 180, 1);

    skyColor = '#000204';

    fogDensity =
      0.04 + t * 0.02;

    sunIntensity = 0;

    zoneName =
      'Phase 4: Hadal Trench (The Deep Void)';

    flashlight.setAttribute(
      'light',
      'intensity',
      1.5 + t * 0.5
    );
  }

  oceanSky.setAttribute('color', skyColor);

  sceneEl.setAttribute(
    'fog',
    `type: exponential; color: ${skyColor}; density: ${fogDensity}`
  );

  sunlight.setAttribute(
    'light',
    'intensity',
    sunIntensity
  );

  ambientLight.setAttribute(
    'light',
    'intensity',
    Math.max(
      0.9 - depth / SETTINGS.maxDepth * 0.85,
      0.04
    )
  );

  const sun =
    document.getElementById('surface-sun');

  sun.setAttribute(
    'visible',
    depth < 35
  );

  zoneDisplay.textContent = zoneName;
}

// ======================================================
// CREATURES
// ======================================================

function spawnCreature() {

  const container =
    document.getElementById('dynamic-creatures');

  const creature =
    document.createElement('a-entity');

  const rigPosition =
    cameraRig.object3D.position;

  const cameraRotation =
    cameraEl.getAttribute('rotation');

  const lookAngle =
    (cameraRotation.y || 0) *
    Math.PI / 180;

  const random = Math.random();

  let tier;

  if (currentDepth < 20) {

    tier = 1;

  } else if (currentDepth < 60) {

    tier = random < 0.75 ? 1 : 2;

  } else if (currentDepth < 110) {

    tier =
      random < 0.60 ? 1 :
      random < 0.80 ? 2 : 3;

  } else if (currentDepth < 180) {

    tier =
      random < 0.50 ? 1 :
      random < 0.65 ? 2 :
      random < 0.85 ? 3 : 4;

  } else {

    tier =
      random < 0.40 ? 1 :
      random < 0.55 ? 2 :
      random < 0.70 ? 3 :
      random < 0.85 ? 4 : 5;
  }

  const side =
    Math.random() > 0.5 ? 1 : -1;

  const angle =
    lookAngle + side * Math.PI / 2.5;

  let distance;

  if (tier === 1) {
    distance = 5 + Math.random() * 5;
  } else if (tier === 2) {
    distance = 15 + Math.random() * 10;
  } else if (tier === 3) {
    distance = 30 + Math.random() * 15;
  } else if (tier === 4) {
    distance = 50 + Math.random() * 20;
  } else {
    distance = 70 + Math.random() * 30;
  }

  const fogFactor =
    Math.min(currentDepth / 300, 1);

  if (tier > 1) {
    distance -= fogFactor * distance * 0.25;
  }

  const spawnX =
    Math.sin(angle) * distance;

  const spawnZ =
    Math.cos(angle) * distance;

  const clearance =
    tier === 1 ? 8 :
    tier === 2 ? 12 : 25;

  const spawnY = Math.min(
    rigPosition.y - 2 - Math.random() * 15,
    4 - clearance
  );

  creature.setAttribute(
    'position',
    `${spawnX} ${spawnY} ${spawnZ}`
  );

  const targetX =
    spawnX - Math.sin(lookAngle) * 200;

  const targetZ =
    spawnZ - Math.cos(lookAngle) * 200;

  const rotationY =
    Math.atan2(
      targetX - spawnX,
      targetZ - spawnZ
    ) * 180 / Math.PI;

  creature.setAttribute(
    'rotation',
    `0 ${rotationY} 0`
  );

  const creatureModels = {

    1: {
      file: 'school_of_herring.glb',
      scale: '5 5 5',
      duration: 90000
    },

    2: {
      file: 'ray.glb',
      scale: '0.3 0.3 0.3',
      duration: 30000
    },

    3: {
      file: 'dolphin.glb',
      scale: '45 45 45',
      duration: 20000
    },

    4: {
      file: 'whale.glb',
      scale: '3 3 3',
      duration: 45000
    },

    5: {
      file: 'blue_whale.glb',
      scale: '5 5 5',
      duration: 60000
    }
  };

  const config = creatureModels[tier];

  const model =
    document.createElement('a-gltf-model');

  model.setAttribute(
    'src',
    config.file
  );

  model.setAttribute(
    'scale',
    config.scale
  );

  model.setAttribute(
    'animation-mixer',
    'clip: *; timeScale: 1'
  );

  if (tier === 4) {
    model.setAttribute(
      'rotation',
      '0 180 0'
    );
  }

  creature.appendChild(model);

  creature.setAttribute(
    'animation',
    `property: position; to: ${targetX} ${spawnY} ${targetZ}; dur: ${config.duration}; easing: linear`
  );

  container.appendChild(creature);

  // Animal-specific sound.
  const audio =
    createCreatureAudio(
      tier,
      creature,
      config.duration
    );

  if (audio) {

    activeCreatures.push({
      element: creature,
      audio
    });
  }

  setTimeout(() => {

    creature.remove();

  }, config.duration + 1000);
}

// ======================================================
// MAIN LOOP
// ======================================================

function animateDescent(timestamp) {

  animateWaterSurface(timestamp);

  animateArms(timestamp * 0.001);

  if (!lastTimestamp) {
    lastTimestamp = timestamp;
  }

  const dt = Math.min(
    (timestamp - lastTimestamp) / 1000,
    0.1
  );

  lastTimestamp = timestamp;

  if (isDiving) {

    if (currentDepth < SETTINGS.maxDepth) {

      currentDepth +=
        SETTINGS.descentSpeed * dt;

      currentDepth = Math.min(
        currentDepth,
        SETTINGS.maxDepth
      );

      cameraRig.object3D.position.y =
        7 - currentDepth;

      depthDisplay.textContent =
        currentDepth.toFixed(1);

      updateEnvironmentStage(currentDepth);

      updateAudioParams();

      const surface =
        document.getElementById('water-surface');

      const fade = Math.min(
        Math.max(
          (currentDepth - 2.5) / 7.5,
          0
        ),
        1
      );

      surface.setAttribute(
        'visible',
        fade < 1
      );

      surface.setAttribute(
        'material',
        'opacity',
        0.72 * (1 - fade)
      );

      const colossal =
        document.getElementById('colossal-entity');

      if (currentDepth >= 350) {

        colossal.object3D.position.y =
          -50 + Math.sin(timestamp * 0.0015) * 2;
      }
    }

    const spawnInterval = Math.max(
      4000,
      8000 -
      currentDepth / SETTINGS.maxDepth * 4000
    );

    if (
      currentDepth >= 3 &&
      timestamp - creatureSpawnTimer >
        spawnInterval
    ) {

      spawnCreature();

      creatureSpawnTimer = timestamp;
    }
  }

  // Ensure camera and moving creatures have
  // updated world transforms for spatial audio.
  sceneEl.object3D.updateMatrixWorld(true);

  updateAudioListener();

  updateCreatureAudio(timestamp);

  requestAnimationFrame(animateDescent);
}

// ======================================================
// START
// ======================================================

startBtn.addEventListener('click', async () => {

  initAudio();

  if (
    audioCtx &&
    audioCtx.state === 'suspended'
  ) {
    await audioCtx.resume();
  }

  isDiving = true;

  startScreen.classList.add('hidden');

  statusDisplay.textContent =
    'SINKING UNCONTROLLABLY...';

  creatureSpawnTimer =
    performance.now();
});

// ======================================================
// AUDIO TOGGLE
// ======================================================

soundToggleBtn.addEventListener('click', () => {

  isMuted = !isMuted;

  soundState.textContent =
    isMuted ? 'OFF' : 'ON';

  soundState.className =
    isMuted
      ? 'text-red-400'
      : 'text-emerald-400';

  if (audioCtx && masterGain) {

    masterGain.gain.setTargetAtTime(
      isMuted ? 0 : SETTINGS.masterVolume,
      audioCtx.currentTime,
      0.1
    );
  }
});

// ======================================================
// RESTART
// ======================================================

recenterBtn.addEventListener('click', () => {

  isDiving = false;
  currentDepth = 0;

  cameraRig.object3D.position.set(0, 7, 0);

  depthDisplay.textContent = '0.0';

  statusDisplay.textContent =
    'SURFACE READY';

  startScreen.classList.remove('hidden');

  const surface =
    document.getElementById('water-surface');

  surface.setAttribute('visible', true);

  surface.setAttribute(
    'material',
    'opacity',
    0.72
  );

  document.getElementById(
    'dynamic-creatures'
  ).innerHTML = '';

  for (const creature of activeCreatures) {
    creature.audio.stop();
  }

  activeCreatures.length = 0;

  updateEnvironmentStage(0);

  updateAudioParams();
});

// ======================================================
// INITIALIZATION
// ======================================================

function initApp() {

  updateEnvironmentStage(0);

  if (sceneEl.hasLoaded) {

    setupMarineSnow();

    requestAnimationFrame(animateDescent);

  } else {

    sceneEl.addEventListener(
      'loaded',
      () => {

        setupMarineSnow();

        requestAnimationFrame(animateDescent);

      },
      { once: true }
    );
  }
}

initApp();
